name: TVList weekly build

on:
  schedule:
    - cron: '0 19 * * 6'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: 1
      CLOUD_BASE_URL: ${{ vars.TVLIST_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sanity check inputs
        run: |
          ls -la
          test -f my_channels.json || (echo "missing my_channels.json" && exit 1)
          test -f verified_urls.json || (echo "missing verified_urls.json" && exit 1)
          test -f Selected-Channels-2026-05-30.m3u8 || (echo "missing master m3u8" && exit 1)
          python3 -c "import json; v=json.load(open('verified_urls.json')); print(f\"whitelist: {len(v['verified_urls'])} verified, {len(v.get('repairs',[]))} repairs, {len(v.get('user_excluded',[]))} excluded\")"

      - name: Generate tvlist-latest.m3u8 + e.xml
        run: python update_tvlist.py --fetch-sources --output tvlist-latest.m3u8

      - name: Filter to t.m3u (verified whitelist, public EPG URL)
        run: python gen_lan_playlist.py

      - name: Package for Pages (rewrite url-tvg, check 25 MiB limit)
        run: |
          python build_cf_pages.py --base-url "$CLOUD_BASE_URL" --out public
          echo "--- t.m3u header ---"
          head -2 public/t.m3u
          echo "--- artifact ---"
          ls -la public/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
